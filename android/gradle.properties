org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true

# Project trên ổ D:, SDK/Gradle/Pub trên ổ E: — tránh tải cache về ổ C.
# GRADLE_USER_HOME=E:\Android\.gradle  (biến môi trường User)
# PUB_CACHE=E:\Android\Pub\Cache       (biến môi trường User)

kotlin.incremental=false

kotlin.daemon.jvm.options=-Xmx4g

# Tránh lỗi Gradle "25.0.2" khi máy cài JDK 25 làm mặc định — dùng JBR của Android Studio.

